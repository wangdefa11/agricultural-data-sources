<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大豆产业链全球供需结构</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(rgb(255 255 255), rgb(24 24 24));
        --fg: light-dark(rgb(28 30 33), rgb(245 245 245));
        --muted: light-dark(rgb(110 114 120), rgb(170 174 180));
        --border: light-dark(rgb(28 30 33 / 12%), rgb(255 255 255 / 14%));
        --input: light-dark(rgb(255 255 255), rgb(38 38 38));
        --s1: light-dark(rgb(51 156 255), rgb(131 195 255));
        --s2: light-dark(rgb(243 136 59), rgb(245 154 86));
        --s3: light-dark(rgb(93 201 119), rgb(116 213 139));
        --s4: light-dark(rgb(235 119 177), rgb(240 143 192));
        --s5: light-dark(rgb(155 121 236), rgb(170 145 239));
        --s6: light-dark(rgb(58 185 177), rgb(90 203 194));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 16px;
      }
      h1 {
        margin: 0 0 14px;
        font-size: 24px;
        font-weight: 600;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 600;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }
      label {
        display: grid;
        gap: 5px;
        font-weight: 600;
      }
      select {
        width: 100%;
        min-height: 40px;
        padding: 7px 34px 7px 10px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--input);
        color: var(--fg);
        font: inherit;
      }
      .pie-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px 28px;
      }
      .pie-panel {
        min-width: 0;
      }
      .pie-body {
        display: grid;
        grid-template-columns: minmax(170px, 210px) minmax(170px, 1fr);
        gap: 10px;
        align-items: center;
      }
      .pie {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .legend {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 7px;
      }
      .legend li {
        display: grid;
        grid-template-columns: 10px minmax(0, 1fr) auto;
        align-items: center;
        gap: 7px;
      }
      .swatch {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      .legend-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .legend-value {
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .center-total {
        fill: var(--fg);
        font-weight: 600;
        font-size: 15px;
      }
      .center-unit,
      .axis-label {
        fill: var(--muted);
        font-size: 11px;
      }
      .trend-section {
        margin-top: 24px;
        position: relative;
      }
      .trend-head {
        display: flex;
        gap: 12px;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 3px;
      }
      .selected-value {
        color: var(--muted);
      }
      .trend {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      .grid-line {
        stroke: var(--border);
        stroke-width: 1;
      }
      .year-line {
        stroke: var(--fg);
        stroke-width: 1.5;
        opacity: 0.55;
      }
      .hit {
        fill: transparent;
        cursor: crosshair;
      }
      .tooltip {
        position: absolute;
        z-index: 3;
        pointer-events: none;
        padding: 7px 9px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--input);
        color: var(--fg);
        box-shadow: 0 4px 18px rgb(0 0 0 / 12%);
        font-size: 13px;
      }
      .note {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      @media (max-width: 760px) {
        .pie-grid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 520px) {
        main {
          padding: 10px;
        }
        .controls {
          grid-template-columns: 1fr;
        }
        .pie-body {
          grid-template-columns: 130px minmax(0, 1fr);
        }
        .trend-head {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>

        <div id="tooltip" class="tooltip" hidden></div>
      </section>

        }

        function polar(radius, angle) {
          return [90 + radius * Math.cos(angle), 88 + radius * Math.sin(angle)];
        }

        function arcPath(start, end) {
          const inner = 38;
          const outer = 66;
          const [x1, y1] = polar(outer, start);
          const [x2, y2] = polar(outer, end);
          const [x3, y3] = polar(inner, end);
          const [x4, y4] = polar(inner, start);
          const large = end - start > Math.PI ? 1 : 0;
          return [
            "M",
            x1,
            y1,
            "A",
            outer,
            outer,
            0,
            large,
            1,
            x2,
            y2,
            "L",
            x3,
            y3,
            "A",
            inner,
            inner,
            0,
            large,
            0,
            x4,
            y4,
            "Z",
          ].join(" ");
        }

        function drawPie(metric) {
          const svg = root.querySelector("#pie-" + metric);
          const legend = root.querySelector("#legend-" + metric);
          const items = topCountries(metric);
          const total = items.reduce((sum, [, value]) => sum + value, 0);
          svg.replaceChildren();
          legend.replaceChildren();
          const label =
            yearSelect.value +
            productSelect.value +
            METRICS[metric] +
            "主要国家分布，前" +
            TOP_COUNT +
            "合计" +
            format(total) +
            UNIT;
          svg.setAttribute("aria-label", label);
          const title = svgNode("title");
          title.textContent = label;
          svg.appendChild(title);

          let angle = -Math.PI / 2;
          for (const [country, value] of items) {
            const span = total ? (value / total) * Math.PI * 2 : 0;
            const color = countryColor(country);
            const path = svgNode("path", {
              d: arcPath(angle, angle + span),
              fill: color,
            });
            const pathTitle = svgNode("title");
            pathTitle.textContent =
              country +
              " " +
              format(value) +
              UNIT +
              "，" +
              ((value / total) * 100).toFixed(1) +
              "%";
            path.appendChild(pathTitle);
            svg.appendChild(path);
            angle += span;

            const item = document.createElement("li");
            const swatch = document.createElement("span");
            swatch.className = "swatch";
            swatch.style.background = color;
            const name = document.createElement("span");
            name.className = "legend-name";
            name.textContent = country;
            const amount = document.createElement("span");
            amount.className = "legend-value";
            amount.textContent =
              format(value) + " · " + ((value / total) * 100).toFixed(0) + "%";
            item.append(swatch, name, amount);
            legend.appendChild(item);
          }

          const totalText = svgNode("text", {
            x: 90,
            y: 84,
            "text-anchor": "middle",
            class: "center-total",
          });
          totalText.textContent = format(total);
          const unitText = svgNode("text", {
            x: 90,
            y: 103,
            "text-anchor": "middle",
            class: "center-unit",
          });
          unitText.textContent = "前" + TOP_COUNT + "合计";
          svg.append(totalText, unitText);
        }

        function niceCeiling(value) {
          if (value <= 0) return 1;
          const power = 10 ** Math.floor(Math.log10(value));
          const scaled = value / power;
          const step =
            scaled <= 1
              ? 1
              : scaled <= 1.5
                ? 1.5
                : scaled <= 2
                  ? 2
                  : scaled <= 3
                    ? 3
                    : scaled <= 4
                      ? 4
                      : scaled <= 5
                        ? 5
                        : scaled <= 6
                          ? 6
                          : scaled <= 8
                            ? 8
                            : 10;
          return step * power;
        }

        function linePath(points) {
          return points
            .map(
              (point, index) =>
                (index ? "L" : "M") +
                " " +
                point[0].toFixed(2) +
                " " +
                point[1].toFixed(2),
            )
            .join(" ");
        }

        function drawTrend() {
          const product = productSelect.value;
          const country = countrySelect.value;
          const metric = metricSelect.value;
          const series = YEARS.map((year) =>
            valueAt(product, country, metric, year),
          );
          const width = 760;
          const height = 210;
          const margin = { left: 52, right: 42, top: 14, bottom: 32 };
          const plotWidth = width - margin.left - margin.right;
          const plotHeight = height - margin.top - margin.bottom;
          const ceiling = niceCeiling(
            Math.max(1, ...series.map((value) => Number(value || 0))),
          );
          const x = (index) =>
            margin.left + (index / Math.max(1, YEARS.length - 1)) * plotWidth;
          const y = (value) =>
            margin.top +
            plotHeight -
            (Number(value || 0) / ceiling) * plotHeight;
          trendSvg.replaceChildren();
          const label =
            country + product + METRICS[metric] + "多年走势，单位" + UNIT;
          trendSvg.setAttribute("aria-label", label);
          const title = svgNode("title");
          title.textContent = label;
          trendSvg.appendChild(title);

          for (let tick = 0; tick <= 4; tick += 1) {
            const value = (ceiling / 4) * tick;
            const yy = y(value);
            trendSvg.appendChild(
              svgNode("line", {
                x1: margin.left,
                x2: width - margin.right,
                y1: yy,
                y2: yy,
                class: "grid-line",
              }),
            );
            const tickLabel = svgNode("text", {
              x: margin.left - 7,
              y: yy + 4,
              "text-anchor": "end",
              class: "axis-label",
            });
            tickLabel.textContent = format(value);
            trendSvg.appendChild(tickLabel);
          }

          const tickIndexes = [
            ...new Set([
              0,
              Math.round((YEARS.length - 1) * 0.2),
              Math.round((YEARS.length - 1) * 0.4),
              Math.round((YEARS.length - 1) * 0.6),
              Math.round((YEARS.length - 1) * 0.8),
              YEARS.length - 1,
            ]),
          ];
          for (const index of tickIndexes) {
            const tickLabel = svgNode("text", {
              x: x(index),
              y: height - 6,
              "text-anchor": "middle",
              class: "axis-label",
            });
            tickLabel.textContent = YEARS[index];
            trendSvg.appendChild(tickLabel);
          }

          const points = series.map((value, index) => [x(index), y(value)]);
          trendSvg.appendChild(
            svgNode("path", {
              d: linePath(points),
              fill: "none",
              stroke: "var(--s1)",
              "stroke-width": 2.5,
            }),
          );

          const guideLine = svgNode("line", {
            y1: margin.top,
            y2: margin.top + plotHeight,
            class: "year-line",
          });
          const guideDot = svgNode("circle", {
            r: 4,
            fill: "var(--s1)",
            stroke: "var(--bg)",
            "stroke-width": 2,
          });
          trendSvg.append(guideLine, guideDot);

          function setGuide(index) {
            guideLine.setAttribute("x1", x(index));
            guideLine.setAttribute("x2", x(index));
            guideDot.setAttribute("cx", x(index));
            guideDot.setAttribute("cy", y(series[index]));
            selectedValue.textContent =
              YEARS[index] +
              "　" +
              country +
              "　" +
              METRICS[metric] +
              " " +
              format(series[index]) +
              " " +
              UNIT;
          }

          const selectedIndex = Math.max(0, YEARS.indexOf(yearSelect.value));
          setGuide(selectedIndex);
          const hit = svgNode("rect", {
            x: margin.left,
            y: margin.top,
            width: plotWidth,
            height: plotHeight,
            class: "hit",
          });
          const indexFromEvent = (event) => {
            const point = trendSvg.createSVGPoint();
            point.x = event.clientX;
            point.y = event.clientY;
            const local = point.matrixTransform(
              trendSvg.getScreenCTM().inverse(),
            );
            return Math.max(
              0,
              Math.min(
                YEARS.length - 1,
                Math.round(
                  ((local.x - margin.left) / plotWidth) * (YEARS.length - 1),
                ),
              ),
            );
          };
          hit.addEventListener("pointermove", (event) => {
            const index = indexFromEvent(event);
            setGuide(index);
            const bounds = root.getBoundingClientRect();
            tooltip.innerHTML =
              "<strong>" +
              YEARS[index] +
              "</strong><br>" +
              country +
              " · " +
              METRICS[metric] +
              "：" +
              format(series[index]) +
              " " +
              UNIT;
            tooltip.hidden = false;
            tooltip.style.left =
              Math.min(
                bounds.width - 190,
                Math.max(8, event.clientX - bounds.left + 12),
              ) + "px";
            tooltip.style.top =
              Math.max(8, event.clientY - bounds.top - 24) + "px";
          });
          hit.addEventListener("pointerleave", () => {
            tooltip.hidden = true;
            setGuide(Math.max(0, YEARS.indexOf(yearSelect.value)));
          });
          hit.addEventListener("click", (event) => {
            const index = indexFromEvent(event);
            yearSelect.value = YEARS[index];
            drawPies();
            setGuide(index);
          });
          trendSvg.appendChild(hit);
        }

        function drawPies() {
          for (const metric of Object.keys(METRICS)) drawPie(metric);
        }

        function updateAll() {
          drawPies();
          drawTrend();
        }

        productSelect.value = DEFAULT_PRODUCT;
        yearSelect.value = DEFAULT_YEAR;
        syncCountries();
        updateAll();

        productSelect.addEventListener("change", () => {
          syncCountries();
          updateAll();
        });
        yearSelect.addEventListener("change", updateAll);
        countrySelect.addEventListener("change", drawTrend);
        metricSelect.addEventListener("change", drawTrend);
      })();
    </script>
  </body>
</html>
