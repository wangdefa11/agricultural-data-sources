  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);

    &quot;var(--viz-series-1)&quot;,
    &quot;var(--viz-series-2)&quot;,
    &quot;var(--viz-series-3)&quot;,
    &quot;var(--viz-series-4)&quot;,
    &quot;var(--viz-series-5)&quot;,
    &quot;var(--viz-series-6)&quot;
  ];
  const PIE_METRICS = [
    [&quot;Production&quot;, &quot;sy-production&quot;, &quot;sy-production-legend&quot;],
    [&quot;Exports&quot;, &quot;sy-exports&quot;, &quot;sy-exports-legend&quot;],
    [&quot;Imports&quot;, &quot;sy-imports&quot;, &quot;sy-imports-legend&quot;],
    [&quot;Domestic Consumption&quot;, &quot;sy-consumption&quot;, &quot;sy-consumption-legend&quot;]
  ];
  const productSelect = root.querySelector(&quot;#sy-product&quot;);
  const yearSelect = root.querySelector(&quot;#sy-year&quot;);
  const countrySelect = root.querySelector(&quot;#sy-country&quot;);
  const metricSelect = root.querySelector(&quot;#sy-metric&quot;);
  const trendSvg = root.querySelector(&quot;#sy-trend&quot;);
  const selectedValue = root.querySelector(&quot;#sy-selected-value&quot;);
  const tooltip = root.querySelector(&quot;#sy-tooltip&quot;);
  const reduceMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;).matches;
  const previousArcs = new Map();
  let guideLine;
  let guideDot;

  const countryLabel = country =&gt; COUNTRY_NAMES[country] || country;
  const countryColor = country =&gt; {
    if (COUNTRY_COLORS[country]) return COUNTRY_COLORS[country];
    const hash = [...country].reduce(
      (sum, character) =&gt; (sum * 31 + character.codePointAt(0)) &gt;&gt;&gt; 0,
      0
    );
    return COLORS[hash % COLORS.length];
  };
  const format = value =&gt; Number(value || 0).toLocaleString(&quot;zh-CN&quot;, {
    minimumFractionDigits: 1,
    maximumFractionDigits: 2
  });
  const svgNode = (name, attrs = {}) =&gt; {
    const node = document.createElementNS(&quot;http://www.w3.org/2000/svg&quot;, name);
    Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, value));
    return node;
  };
  const valueAt = (product, country, metric, index) =&gt;
    DATA[product][country][metric]?.[index] ?? null;

  function syncYears() {
    yearSelect.replaceChildren();
    YEARS.forEach(year =&gt; {
      const option = document.createElement(&quot;option&quot;);
      option.value = year;
      option.textContent = year;
      yearSelect.appendChild(option);
    });
    yearSelect.value = &quot;2025/26&quot;;
  }

  function allCountriesForProduct() {
    return Object.keys(DATA[productSelect.value]).sort((a, b) =&gt;
      countryLabel(a).localeCompare(countryLabel(b), &quot;zh-CN&quot;)
    );
  }

  function countriesForProduct() {
    const available = DATA[productSelect.value];
    return IMPORTANT_COUNTRIES[productSelect.value].filter(country =&gt; available[country]);
  }

  function syncCountries() {
    const current = countrySelect.value;
    const countries = countriesForProduct();
    countrySelect.replaceChildren();
    countries.forEach(country =&gt; {
      const option = document.createElement(&quot;option&quot;);
      option.value = country;
      option.textContent = countryLabel(country);
      countrySelect.appendChild(option);
    });
    countrySelect.value = countries.includes(current)
      ? current
      : countries.includes(&quot;China&quot;) ? &quot;China&quot; : countries[0];
  }

  function topCountries(metric, yearIndex) {
    const product = productSelect.value;
    return allCountriesForProduct()
      .map(country =&gt; [country, Number(valueAt(product, country, metric, yearIndex) || 0)])
      .filter(([, value]) =&gt; value &gt; 0)
      .sort((a, b) =&gt; b[1] - a[1])
      .slice(0, 6);
  }

  function polar(radius, angle) {
    return [90 + radius * Math.cos(angle), 88 + radius * Math.sin(angle)];
  }

  function arcPath(start, end) {
    const innerRadius = 38;
    const outerRadius = 66;
    const [x1, y1] = polar(outerRadius, start);
    const [x2, y2] = polar(outerRadius, end);
    const [x3, y3] = polar(innerRadius, end);
    const [x4, y4] = polar(innerRadius, start);
    const large = end - start &gt; Math.PI ? 1 : 0;
    return [
      &quot;M&quot;, x1, y1,
      &quot;A&quot;, outerRadius, outerRadius, 0, large, 1, x2, y2,
      &quot;L&quot;, x3, y3,
      &quot;A&quot;, innerRadius, innerRadius, 0, large, 0, x4, y4,
      &quot;Z&quot;
    ].join(&quot; &quot;);
  }

  function animateArc(path, key, next) {
    const previous = previousArcs.get(key) || [next[0], next[0]];
    previousArcs.set(key, next);
    if (reduceMotion) {
      path.setAttribute(&quot;d&quot;, arcPath(next[0], next[1]));
      return;
    }
    const started = performance.now();
    const duration = 260;
    const tick = now =&gt; {
      const progress = Math.min(1, (now - started) / duration);
      const eased = 1 - Math.pow(1 - progress, 3);
      const start = previous[0] + (next[0] - previous[0]) * eased;
      const end = previous[1] + (next[1] - previous[1]) * eased;
      path.setAttribute(&quot;d&quot;, arcPath(start, end));
      if (progress &lt; 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  function drawPie(metric, svgId, legendId) {
    const svg = root.querySelector(`#${svgId}`);
    const legend = root.querySelector(`#${legendId}`);
    const yearIndex = YEARS.indexOf(yearSelect.value);
    const items = topCountries(metric, yearIndex);
    const total = items.reduce((sum, [, value]) =&gt; sum + value, 0);
    svg.replaceChildren();
    legend.replaceChildren();
    svg.setAttribute(
      &quot;aria-label&quot;,
      `${yearSelect.value}${productSelect.value}${METRIC_NAMES[metric]}主要国家分布，前6合计${format(total)}百万吨`
    );
    const title = svgNode(&quot;title&quot;);
    title.textContent = svg.getAttribute(&quot;aria-label&quot;);
    svg.appendChild(title);

    let angle = -Math.PI / 2;
    items.forEach(([country, value]) =&gt; {
      const span = total ? (value / total) * Math.PI * 2 : 0;
      const next = [angle, angle + span];
      const color = countryColor(country);
      const path = svgNode(&quot;path&quot;, {
        fill: color,
        &quot;aria-label&quot;:
          `${countryLabel(country)} ${format(value)}百万吨，` +
          `${((value / total) * 100).toFixed(1)}%`
      });
      const pathTitle = svgNode(&quot;title&quot;);
      pathTitle.textContent = path.getAttribute(&quot;aria-label&quot;);
      path.appendChild(pathTitle);
      svg.appendChild(path);
      animateArc(path, `${svgId}-${country}`, next);
      angle += span;

      const li = document.createElement(&quot;li&quot;);
      const swatch = document.createElement(&quot;span&quot;);
      swatch.className = &quot;sy-swatch&quot;;
      swatch.style.background = color;
      const name = document.createElement(&quot;span&quot;);
      name.className = &quot;sy-legend-name&quot;;
      name.textContent = countryLabel(country);
      const amount = document.createElement(&quot;span&quot;);
      amount.className = &quot;sy-legend-value&quot;;
      amount.textContent =
        `${format(value)} · ${((value / total) * 100).toFixed(0)}%`;
      li.append(swatch, name, amount);
      legend.appendChild(li);
    });

    const totalText = svgNode(&quot;text&quot;, {
      x: 90,
      y: 84,
      &quot;text-anchor&quot;: &quot;middle&quot;,
      class: &quot;sy-center-total&quot;
    });
    totalText.textContent = format(total);
    const unitText = svgNode(&quot;text&quot;, {
      x: 90,
      y: 104,
      &quot;text-anchor&quot;: &quot;middle&quot;,
      class: &quot;sy-center-unit&quot;
    });
    unitText.textContent = &quot;前6合计&quot;;
    svg.append(totalText, unitText);
  }

  function niceCeiling(value) {
    if (value &lt;= 0) return 1;
    const power = Math.pow(10, Math.floor(Math.log10(value)));
    return Math.ceil(value / power) * power;
  }

  function linePath(points) {
    return points.map((point, index) =&gt;
      `${index ? &quot;L&quot; : &quot;M&quot;} ${point[0].toFixed(2)} ${point[1].toFixed(2)}`
    ).join(&quot; &quot;);
  }

  function positionTooltip(event, html) {
    tooltip.innerHTML = html;
    tooltip.hidden = false;
    const bounds = root.getBoundingClientRect();
    tooltip.style.left =
      `${Math.min(bounds.width - 190, Math.max(8, event.clientX - bounds.left + 12))}px`;
    tooltip.style.top =
      `${Math.max(8, event.clientY - bounds.top - 24)}px`;
  }

  function drawTrend() {
    const product = productSelect.value;
    const country = countrySelect.value;
    const metric = metricSelect.value;
    const series = DATA[product][country][metric] || Array(YEARS.length).fill(null);
    const width = 760;
    const height = 200;
    const margin = { left: 52, right: 42, top: 12, bottom: 30 };
    const plotWidth = width - margin.left - margin.right;
    const plotHeight = height - margin.top - margin.bottom;
    const ceiling = niceCeiling(
      Math.max(1, ...series.map(value =&gt; Number(value || 0)))
    );
    const x = index =&gt; margin.left + (index / (YEARS.length - 1)) * plotWidth;
    const y = value =&gt;
      margin.top + plotHeight - (Number(value || 0) / ceiling) * plotHeight;
    trendSvg.replaceChildren();
    trendSvg.setAttribute(
      &quot;aria-label&quot;,
      `${countryLabel(country)}${product}${METRIC_NAMES[metric]}多年走势，单位百万吨`
    );
    const title = svgNode(&quot;title&quot;);
    title.textContent = trendSvg.getAttribute(&quot;aria-label&quot;);
    const desc = svgNode(&quot;desc&quot;);
    desc.textContent = &quot;竖线对应上方饼图的市场年度；移动鼠标可临时查看其他年度，点击可切换饼图年度。&quot;;
    trendSvg.append(title, desc);

    for (let tick = 0; tick &lt;= 4; tick += 1) {
      const value = (ceiling / 4) * tick;
      const yy = y(value);
      trendSvg.appendChild(svgNode(&quot;line&quot;, {
        x1: margin.left,
        x2: width - margin.right,
        y1: yy,
        y2: yy,
        class: &quot;sy-grid-line&quot;
      }));
      const label = svgNode(&quot;text&quot;, {
        x: margin.left - 7,
        y: yy + 4,
        &quot;text-anchor&quot;: &quot;end&quot;,
        class: &quot;sy-axis-label&quot;
      });
      label.textContent = format(value);
      trendSvg.appendChild(label);
    }
    [0, 5, 10, 15, 20, 26].forEach(index =&gt; {
      const label = svgNode(&quot;text&quot;, {
        x: x(index),
        y: height - 5,
        &quot;text-anchor&quot;: &quot;middle&quot;,
        class: &quot;sy-axis-label&quot;
      });
      label.textContent = YEARS[index];
      trendSvg.appendChild(label);
    });

    const points = series.map((value, index) =&gt; [x(index), y(value)]);
    trendSvg.appendChild(svgNode(&quot;path&quot;, {
      d: linePath(points),
      fill: &quot;none&quot;,
      stroke: COLORS[0],
      &quot;stroke-width&quot;: 2.5
    }));

    guideLine = svgNode(&quot;line&quot;, {
      y1: margin.top,
      y2: margin.top + plotHeight,
      class: &quot;sy-year-line&quot;
    });
    guideDot = svgNode(&quot;circle&quot;, {
      r: 4,
      fill: COLORS[0],
      stroke: &quot;var(--background)&quot;,
      &quot;stroke-width&quot;: 2
    });
    trendSvg.append(guideLine, guideDot);

    function setGuide(index, updateLabel = true) {
      guideLine.setAttribute(&quot;x1&quot;, x(index));
      guideLine.setAttribute(&quot;x2&quot;, x(index));
      guideDot.setAttribute(&quot;cx&quot;, x(index));
      guideDot.setAttribute(&quot;cy&quot;, y(series[index]));
      if (updateLabel) {
        selectedValue.textContent =
          `${YEARS[index]}　${countryLabel(country)}　` +
          `${METRIC_NAMES[metric]} ${format(series[index])} 百万吨`;
      }
    }

    const selectedIndex = Math.max(0, YEARS.indexOf(yearSelect.value));
    setGuide(selectedIndex);

    const hit = svgNode(&quot;rect&quot;, {
      x: margin.left,
      y: margin.top,
      width: plotWidth,
      height: plotHeight,
      class: &quot;sy-hit&quot;
    });
    const indexFromEvent = event =&gt; {
      const point = trendSvg.createSVGPoint();
      point.x = event.clientX;
      point.y = event.clientY;
      const local = point.matrixTransform(trendSvg.getScreenCTM().inverse());
      return Math.max(
        0,
        Math.min(
          YEARS.length - 1,
          Math.round(((local.x - margin.left) / plotWidth) * (YEARS.length - 1))
        )
      );
    };
    hit.addEventListener(&quot;pointermove&quot;, event =&gt; {
      const index = indexFromEvent(event);
      setGuide(index);
      positionTooltip(
        event,
        `&lt;strong&gt;${YEARS[index]}&lt;/strong&gt;&lt;br&gt;` +
        `${countryLabel(country)} · ${METRIC_NAMES[metric]}：` +
        `${format(series[index])} 百万吨`
      );
    });
    hit.addEventListener(&quot;pointerleave&quot;, () =&gt; {
      tooltip.hidden = true;
      setGuide(Math.max(0, YEARS.indexOf(yearSelect.value)));
    });
    hit.addEventListener(&quot;click&quot;, event =&gt; {
      const index = indexFromEvent(event);
      yearSelect.value = YEARS[index];
      drawPies();
      setGuide(index);
    });
    trendSvg.appendChild(hit);
  }

  function drawPies() {
    PIE_METRICS.forEach(args =&gt; drawPie(...args));
  }

  function updateAll() {
    drawPies();
    drawTrend();
  }

  productSelect.addEventListener(&quot;change&quot;, () =&gt; {
    syncCountries();
    updateAll();
  });
  yearSelect.addEventListener(&quot;change&quot;, updateAll);
  countrySelect.addEventListener(&quot;change&quot;, drawTrend);
  metricSelect.addEventListener(&quot;change&quot;, drawTrend);
  syncYears();
  syncCountries();
  updateAll();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
