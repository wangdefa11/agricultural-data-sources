<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国红枣产量集中度</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#181818);--fg:light-dark(#1c1e21,#f5f5f5);--muted:light-dark(#6e7278,#aaafb4);--border:light-dark(#1c1e211f,#ffffff24);--blue:light-dark(#339cff,#83c3ff);--orange:light-dark(#f3883b,#f59a56);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}main{padding:18px}h1{font-size:22px;margin:0 0 5px}h2{font-size:17px;margin:0 0 6px}.sub,.source{color:var(--muted);font-size:11px;line-height:1.65}.layout{display:grid;grid-template-columns:minmax(220px,.7fr) minmax(300px,1.3fr);gap:18px;margin-top:18px}.card{border:1px solid var(--border);border-radius:12px;padding:16px}.pie{position:relative;width:min(250px,80vw);aspect-ratio:1;margin:12px auto;border-radius:50%;background:conic-gradient(var(--blue) 0 45.2%,var(--orange) 45.2% 100%)}.pie:after{content:"";position:absolute;inset:29%;border-radius:50%;background:var(--bg)}.center{position:absolute;inset:30%;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center}.center b{font-size:28px;color:var(--blue)}.center span{font-size:11px;color:var(--muted)}.legend{display:grid;gap:10px;margin-top:14px}.row{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:12px}.dot{width:10px;height:10px;border-radius:50%}.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}.stat div{padding:14px;border-radius:10px;background:color-mix(in srgb,var(--blue) 8%,transparent)}.stat b{display:block;font-size:25px;color:var(--blue)}.stat span{font-size:11px;color:var(--muted)}.source{margin-top:12px;padding-top:9px;border-top:1px solid var(--border)}.source a{color:inherit;text-underline-offset:2px}@media(max-width:660px){main{padding:10px}.layout{grid-template-columns:1fr}.stat{grid-template-columns:1fr}}
</style></head><body><main>
<h1>新疆红枣产量与全国占比</h1><p class="sub">采用2022年官方材料口径。该指标是全口径红枣产量，不能直接替代灰枣干制成品量或期货可交割量。</p>
<div class="layout"><section class="card"><h2>2022年产量占比</h2><div class="pie" role="img" aria-label="新疆红枣产量占全国45.2%"><div class="center"><b>45.2%</b><span>新疆占全国</span></div></div><div class="legend"><div class="row"><i class="dot" style="background:var(--blue)"></i><span>新疆</span><b>45.2%</b></div><div class="row"><i class="dot" style="background:var(--orange)"></i><span>其他地区</span><b>54.8%</b></div></div></section><section class="card"><h2>新疆供给地位</h2><div class="stat"><div><b>337</b><span>新疆红枣产量（万吨）</span></div><div><b>45.2%</b><span>占全国红枣产量</span></div></div><p class="sub">新疆尤其是南疆，是灰枣种植、收购和加工的核心区域。盘面研究还需继续扣除非灰枣品种、鲜干转换损耗、等级筛选和不可交割货源。</p><p class="source">来源：国家标准公开征求意见材料<a href="https://std.samr.gov.cn/dcpspTools/gbPlan/download?path=%2Fzxd%2F2014057243%2F20_%E6%A0%87%E5%87%86%E8%B5%B7%E8%8D%89%2F20_DI_2014057243_%E5%B9%B2%E5%88%B6%E7%BA%A2%E6%9E%A3.pdf" target="_blank" rel="noreferrer">《干制红枣》标准起草资料</a>。图中仅使用文件明确披露的337万吨和45.2%，不反推全国总量。</p></section></div>
</main><script>(()=>{const root=document.querySelector('main'),send=()=>parent.postMessage({type:'commodity-chart-height',height:Math.ceil(root.getBoundingClientRect().height)+2},location.origin);new ResizeObserver(send).observe(root);addEventListener('load',send);addEventListener('resize',send);addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='commodity-chart-measure')send()});requestAnimationFrame(send)})()</script></body></html>
