<div class="year"><span class="total">总消费 11456</span><div class="bar"><i class="seg crush" style="height:82.8%">压榨 9490</i><i class="seg food" style="height:13.6%">食用 1560</i><i class="seg seed" style="height:3.6%">种用及其他 406</i></div><b>2024/25估计</b></div>
