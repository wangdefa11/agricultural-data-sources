<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国苹果产量趋势</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#181818);--fg:light-dark(#1c1e21,#f5f5f5);--muted:light-dark(#6e7278,#aaafb4);--border:light-dark(#1c1e211f,#ffffff24);--blue:light-dark(#339cff,#83c3ff);--green:light-dark(#5dc977,#74d58b);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}main{padding:18px}h1{font-size:22px;margin:0 0 5px}.sub,.source{color:var(--muted);font-size:11px;line-height:1.65}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.kpi,.card{border:1px solid var(--border);border-radius:12px;padding:15px}.kpi b{display:block;font-size:24px;color:var(--blue)}.kpi span{font-size:11px;color:var(--muted)}h2{font-size:17px;margin:0 0 8px}svg{display:block;width:100%;height:auto}.grid{stroke:var(--border);stroke-width:1}.axis{fill:var(--muted);font-size:10px}.value{fill:var(--blue);font-size:10px;font-weight:700}.regions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.regions span{padding:6px 11px;border-radius:999px;background:color-mix(in srgb,var(--blue) 11%,transparent);color:var(--fg);font-size:11px}.source{margin-top:12px;padding-top:9px;border-top:1px solid var(--border)}.source a{color:inherit;text-underline-offset:2px}@media(max-width:620px){main{padding:10px}.kpis{grid-template-columns:1fr}.kpi b{font-size:20px}}
</style></head><body><main>
<h1>中国苹果产量趋势</h1><p class="sub">国家统计局自然年口径，单位为万吨；全国苹果产量不等于红富士商品果或期货可交割量。</p>
<div class="kpis"><div class="kpi"><b>4,757</b><span>2022年全国苹果产量（万吨）</span></div><div class="kpi"><b>+31.0%</b><span>较2013年累计增长</span></div><div class="kpi"><b>陕西、山东</b><span>重点产区，同时关注甘肃、山西等</span></div></div>
<section class="card"><h2>2013—2022年全国苹果产量</h2><svg id="chart" viewBox="0 0 900 350" role="img" aria-label="2013年至2022年中国苹果产量折线图"></svg><p class="source">来源：国家统计局<a href="https://www.stats.gov.cn/zt_18555/ztsj/jzgj/jzsc2023/202404/P020240417553133577139.pdf" target="_blank" rel="noreferrer">《中国统计摘要2023》</a>，单位：万吨，自然年。2022年为该表所列最新年份。</p></section>
<section class="card" style="margin-top:12px"><h2>主要生产区域</h2><p class="sub">省级产量需另按同一年鉴口径采集后才能绘制占比；目前只标识研究中需要重点跟踪的产区，不填未经核验的比例。</p><div class="regions"><span>陕西</span><span>山东</span><span>甘肃</span><span>山西</span><span>河南</span><span>辽宁</span></div></section>
</main><script>
const data=[[2013,3630],[2014,3735],[2015,3890],[2016,4039],[2017,4139],[2018,3923],[2019,4243],[2020,4407],[2021,4597],[2022,4757]],svg=document.querySelector('#chart'),W=900,H=350,L=62,R=22,T=32,B=45,min=3400,max=4900,x=i=>L+i*(W-L-R)/(data.length-1),y=v=>T+(max-v)*(H-T-B)/(max-min),ns='http://www.w3.org/2000/svg';
const add=(tag,attrs,text)=>{const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(text)n.textContent=text;svg.append(n);return n};
[3500,4000,4500].forEach(v=>{add('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),class:'grid'});add('text',{x:L-10,y:y(v)+4,class:'axis','text-anchor':'end'},v)});add('polyline',{points:data.map((d,i)=>`${x(i)},${y(d[1])}`).join(' '),fill:'none',stroke:'var(--blue)','stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round'});data.forEach((d,i)=>{add('circle',{cx:x(i),cy:y(d[1]),r:5,fill:'var(--bg)',stroke:'var(--blue)','stroke-width':3});add('text',{x:x(i),y:H-17,class:'axis','text-anchor':'middle'},d[0]);if(i===0||i===data.length-1)add('text',{x:x(i),y:y(d[1])-12,class:'value','text-anchor':'middle'},d[1])});
(()=>{const root=document.querySelector('main'),send=()=>parent.postMessage({type:'commodity-chart-height',height:Math.ceil(root.getBoundingClientRect().height)+2},location.origin);new ResizeObserver(send).observe(root);addEventListener('load',send);addEventListener('resize',send);addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='commodity-chart-measure')send()});requestAnimationFrame(send)})();
</script></body></html>
